[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veras-harness"
version = "1.0.0"
description = "Verification-guided harness for operations-research agents"
requires-python = ">=3.11"

[project.scripts]
veras = "veras_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
